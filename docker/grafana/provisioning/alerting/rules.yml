# Uyarı kuralları.
#
# Sağlık kontrollerinden FARKI: onlar DURUM izliyor (Redis ayakta mı, kaç ölü
# mesaj var). Buradaki kural DESEN izliyor — hiçbir bağımlılık çökmemiş olabilir
# ama hata oranı fırlamıştır. İkisi farklı sorulara cevap veriyor.

apiVersion: 1

groups:
  - orgId: 1
    name: log-alerts
    folder: Uyarılar

    # Kural bu sıklıkla değerlendiriliyor.
    interval: 1m

    rules:
      - uid: error-rate-5m
        title: Hata oranı yüksek
        condition: threshold

        # Üç adım: A veriyi çeker, reduce tek sayıya indirir, threshold karşılaştırır.
        data:
          - refId: A
            relativeTimeRange:
              from: 300   # son 5 dakika
              to: 0
            datasourceUid: elasticsearch
            model:
              refId: A
              query: 'log.level:Error'
              timeField: "@timestamp"
              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings:
                    interval: 5m
                    min_doc_count: "0"

          - refId: reduce
            datasourceUid: __expr__
            model:
              refId: reduce
              type: reduce
              expression: A
              reducer: sum

          - refId: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator:
                    type: gt
                    params: [10]

        # Log yoksa uyarı ÇIKMAMALI: "hiç hata yok" iyi bir durum. NoData'yı
        # alarm saymak, sistem sessizken sürekli bildirim üretirdi.
        noDataState: OK

        # Sorgunun kendisi patlarsa bu bir arıza; sessiz kalmamalı.
        execErrState: Error

        # Eşik aşılır aşılmaz bildir; hata patlaması geciktirilmemeli.
        for: 0m

        annotations:
          summary: 'Son 5 dakikada 10''dan fazla hata var.'
          description: 'Kibana''da log.level:"Error" ile son 5 dakikaya bakın.'
