# Uyarıların gideceği yer. Sağlık paneliyle aynı Slack kanalı — iki ayrı kanal
# yerine tek yerde toplanması, bakılma olasılığını artırıyor.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-receiver
        type: slack
        settings:
          # Adres ortam değişkeninden; repoda tutulmuyor.
          url: $GF_SLACK_WEBHOOK_URL

          # Başlık ve metin verilmiyor: Grafana kendi varsayılan şablonlarını
          # kullanıyor (kural adı, değer, etiketler, panele bağlantı).
          #
          # Önce "slack.title"/"slack.text" yazılmıştı — bunlar Prometheus
          # Alertmanager'ın şablon adları, Grafana'da tanımlı değil. Sonuç:
          # kural tetikleniyor, uyarı aktif görünüyor ama mesaj oluşturulamadığı
          # için Slack'e HİÇBİR ŞEY gitmiyordu. Sessiz bir başarısızlık.
