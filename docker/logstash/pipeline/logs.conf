# Kafka'daki "logs" topic'inden okur, gereksiz alanları atar, Elasticsearch'e yazar.
#
# Uygulamalar ECS formatında JSON üretiyor (Elastic.CommonSchema.Serilog), yani alan
# adları Elasticsearch'ün ve ileride Elastic APM'in beklediği şemada. Dönüştürecek
# bir şey yok; buradaki tek iş, kullanılmayan alanları temizlemek.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs"]

    # Kendi tüketici grubu: offset'i Kafka'da tutar, Logstash yeniden başlarsa
    # kaldığı yerden devam eder ve logları baştan işlemez.
    group_id => "logstash-logs"

    # İlk bağlanışta topic'in başından oku — Logstash kurulmadan önce birikmiş
    # loglar da aktarılsın.
    auto_offset_reset => "earliest"

    # @timestamp'i JSON'dan kendisi alıyor; ayrı bir date filtresine gerek yok.
    # (Önce eklenmişti ve her belgeye _dateparsefailure etiketi düşürüyordu.)
    codec => json
  }
}

filter {
  # ECS formatter, log özelliklerini TİPE GÖRE iki ayrı yere koyuyor: string olanlar
  # labels.*, diğerleri (Guid, dizi, sayı) metadata.*. Sonuç olarak actor.id
  # labels altında, target.user.id metadata altında kalıyordu — hangi alanı ararken
  # hangi öneki yazacağın belli olmuyordu.
  #
  # Burada ikisi de üst düzeye taşınıyor: actor.id, target.user.id. Denetim
  # sorgularının dayandığı alanlar bunlar, tahmin edilebilir olmaları şart.
  ruby {
    code => '
      ["labels", "metadata"].each do |container|
        source = event.get(container)
        next unless source.is_a?(Hash)

        source.keys.each do |key|
          next unless key.start_with?("actor.", "target.")

          # "actor.id" -> [actor][id] biçiminde iç içe alan
          path = key.split(".").map { |part| "[#{part}]" }.join
          event.set(path, source[key])
          event.remove("[#{container}][#{key}]")
        end
      end
    '
  }


  # ECS formatter belge başına 33 alan üretiyor ve çoğu bu projede hiçbir şey
  # anlatmıyor. Kalabalık yalnızca depolama israfı değil: Kibana'da bir belgeye
  # bakarken aradığın üç satırı otuz satırın içinden ayıklamak zorunda kalıyorsun.
  #
  # DİKKAT: iç içe alanlar köşeli parantezle yazılmalı. "event.original" yazmak
  # Logstash'e nokta içeren DÜZ bir alan adı arattırır, bulamaz ve sessizce hiçbir
  # şey silmez.
  mutate {
    remove_field => [
      # Ham mesajın tamamının ikinci kopyası — belge başına ~900 karakter.
      "[event][original]",

      # Her belgede aynı: hangi kütüphanenin ürettiği, şema sürümü.
      "[agent][type]", "[agent][version]", "[ecs][version]",
      "[service][type]", "[service][version]",

      # @timestamp'in kopyaları ve log.level'ın sayısal hali.
      "[event][created]", "[event][timezone]", "[event][severity]",

      # Tek makineli kurulumda sabit; container kimliğini service.name zaten veriyor.
      "[host][architecture]", "[host][hostname]",
      "[host][os][full]", "[host][os][platform]", "[host][os][version]",

      # Container içinde her zaman root; gerçek kullanıcı kimliği değil.
      "[user][domain]", "[user][name]",

      # Çalışma zamanı ayrıntısı: tek container'da tanı değeri yok.
      "[process][name]", "[process][pid]", "[process][title]",
      "[process][thread][id]", "[process][thread][name]",

      # MessageTemplate, message alanının doldurulmamış hali — aynı bilgi iki kez.
      # ConnectionId/ParentId yerine trace.id ve span.id kullanılıyor.
      "[labels][MessageTemplate]", "[labels][ConnectionId]", "[labels][ParentId]",

      "@version"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Index adı servis bazlı: Kibana'da tek servise bakmak kolaylaşıyor ve
    # retention politikası index başına uygulanıyor.
    index => "logs-%{[service][name]}-%{+YYYY.MM.dd}"

    # ES şemayla uyuşmayan bir belge reddederse tüm akış durmasın.
    action => "create"
  }
}
