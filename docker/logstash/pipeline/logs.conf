# Kafka'daki "logs" topic'inden okur, Elasticsearch'e yazar.
#
# Uygulamalar zaten ECS formatında JSON üretiyor (Elastic.CommonSchema.Serilog),
# yani alan adları Elasticsearch'ün ve ileride Elastic APM'in beklediği şemada.
# Bu yüzden filter bölümü neredeyse boş — dönüştürecek bir şey yok.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs"]

    # Kendi tüketici grubu: offset'i Kafka'da tutar, Logstash yeniden başlarsa
    # kaldığı yerden devam eder ve logları baştan işlemez.
    group_id => "logstash-logs"

    # İlk bağlanışta topic'in başından oku — Logstash kurulmadan önce birikmiş
    # loglar da Elasticsearch'e aktarılsın.
    auto_offset_reset => "earliest"

    codec => json
  }
}

filter {
  # Serilog'un yazdığı @timestamp zaten ISO-8601; Logstash'in kendi ekleyeceği
  # @timestamp (mesajın Logstash'e VARDIĞI an) onu ezmesin diye açıkça ayrıştırılıyor.
  # Aradaki fark saniyeler değil dakikalar olabilir: Kafka'da bekleyen bir log,
  # Logstash geç kalkarsa çok sonra işlenir ve zaman çizelgesi kayardı.
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Logstash'in eklediği, bizim için değeri olmayan alanlar.
  mutate {
    remove_field => ["event.original", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Data stream yerine klasik index: ILM politikası ve şablonu elle kurulduğu
    # için (bkz. docker/elasticsearch/setup.sh) daha öngörülebilir.
    index => "logs-%{[service][name]}-%{+YYYY.MM.dd}"

    # ES şemayla uyuşmayan bir belge reddederse tüm akış durmasın; reddedilen
    # kayıt ayrı dosyaya düşer ve incelenebilir.
    action => "create"
  }
}
