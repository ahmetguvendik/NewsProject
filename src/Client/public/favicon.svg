<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Telgraf">
  <!--
    Telgraf marka işareti.

    Üst bardaki logonun (.brand__mark) favicon karşılığı: accent renginde bir
    nokta ve çevresinde aynı rengin soluk halesi. Oradaki ölçüler 9px nokta ve
    4px hale; burada 32'lik tuvale oranlanarak yeniden kuruldu.

    Kelime damgası ("Telgraf") BİLEREK YOK: 16x16'ya düşen bir sekmede okunmaz,
    yalnızca lekeye dönüşürdü. Favicon'un işi markayı okutmak değil, sekmeler
    arasında ayırt ettirmek.

    Koyu zemin uygulamanın kendi arka planı (#0e1013). Şeffaf bırakılsaydı açık
    temalı tarayıcı çubuğunda mavi nokta tek başına asılı kalır ve halesi
    kaybolurdu; kendi zeminini taşıyınca her iki temada da aynı görünüyor.

    NOT: XML yorumlarında çift tire kullanılamaz, bu yüzden CSS değişken adları
    burada açık renk koduyla yazıldı.
  -->
  <rect width="32" height="32" rx="7" fill="#0e1013"/>

  <!-- Hale: .brand__mark'taki box-shadow'un karşılığı, accent rengi %14 saydam -->
  <circle cx="16" cy="16" r="10" fill="#4f9cf9" opacity=".14"/>

  <!-- İşaretin kendisi, accent rengi #4f9cf9 -->
  <circle cx="16" cy="16" r="5" fill="#4f9cf9"/>
</svg>
