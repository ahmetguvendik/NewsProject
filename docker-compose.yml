services:

  # ─── API GATEWAY ────────────────────────────────────────────
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.16.0-debian}
    restart: always
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
    depends_on:
      - etcd
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      - apisix

  # identity-service ve news-service'e giden route'ları APISIX Admin API'sine
  # yazan tek seferlik (one-shot) servis. Idempotent — aynı ID'lerin üzerine yazar.
  #
  # `setup` profilinde olduğu için normal `docker compose up` ile ÇALIŞMAZ:
  # route'lar etcd'de (etcd_data volume) kalıcı olduğundan her açılışta yeniden
  # yazılmalarına gerek yok. Şu durumlarda bir kez çalıştırın:
  #   docker compose --profile setup up apisix-routes
  # - ilk kurulumda
  # - `docker compose down -v` sonrası (volume'lar silindiği için)
  # - setup-routes.sh'e yeni route eklendiğinde
  apisix-routes:
    profiles: ["setup"]
    image: curlimages/curl:8.10.1
    container_name: apisix-routes
    volumes:
      - ./docker/apisix/setup-routes.sh:/setup-routes.sh:ro
    entrypoint: ["sh", "/setup-routes.sh"]
    restart: "no"
    depends_on:
      apisix:
        condition: service_started
      identity-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
    networks:
      - apisix

  # APISIX'in route ve upstream'lerini arayüzden görmek/düzenlemek için.
  # etcd'ye doğrudan bağlanıyor — APISIX gateway'inden bağımsız çalışır.
  #
  # Port 9000 MinIO'da kullanıldığı için host tarafında 9800'e yayınlanıyor.
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: apisix-dashboard
    restart: always
    ports:
      - "9800:9000"
    volumes:
      - ./docker/apisix-dashboard/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      etcd:
        condition: service_started
    networks:
      - apisix

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.16
    restart: always
    volumes:
      - etcd_data:/etcd-data
    environment:
      ETCD_DATA_DIR: /etcd-data
      ETCD_ENABLE_V2: "true"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    command:
      - etcd
    ports:
      - "2379:2379/tcp"
    networks:
      - apisix

  # ─── AUTH ───────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - keycloak_data:/opt/keycloak/data
      # news-portal realm'i (admin/editor/user rolleri + news-portal-client) otomatik import edilir.
      #
      # Realm dosyasında brute-force koruması açık (bruteForceProtected). Giriş
      # istekleri APISIX'ten geçmediği (client token'ı doğrudan Keycloak'tan alır)
      # için rate limit gateway'de değil burada yapılır — üstelik IP değil hesap
      # bazlı çalıştığından saldırgan IP değiştirse de koruma sürer.
      # permanentLockout=false: kilit süre dolunca kendiliğinden açılır.
      #
      # UYARI: realm JSON'ı yorum kabul etmez ve tanımadığı alanda import
      # tamamen başarısız olur (Keycloak açılmaz). Açıklamalar bu yüzden burada.
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - apisix

  # ─── DATABASES ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahmet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Ahmet.123}
      POSTGRES_DB: NewsIdentityServiceDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NewsServiceDb + NotificationServiceDb'yi ilk açılışta oluşturur
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ahmet} -d NewsIdentityServiceDb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - apisix

  # ─── OBJECT STORAGE ─────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-telgraf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Telgraf.123}
    ports:
      # 9000 API, 9001 web konsolu. API portu host'a açık olmak zorunda:
      # tarayıcı imzalı URL ile dosyayı doğrudan buraya yüklüyor.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - apisix

  # Bucket'ı oluşturur, görselleri herkese açık okunur yapar ve staging
  # klasörüne 1 günlük ömür kuralı koyar. Idempotent.
  #
  # apisix-routes gibi `setup` profilinde: bucket ve ayarları minio_data
  # volume'unda kalıcı, her açılışta yeniden kurulmasına gerek yok.
  #   docker compose --profile setup up minio-init
  minio-init:
    profiles: ["setup"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-telgraf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Telgraf.123}
      MINIO_BUCKET: ${MINIO_BUCKET:-telgraf-media}
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./docker/minio/setup.sh:/setup.sh:ro
    restart: "no"
    networks:
      - apisix

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - apisix

  # ─── MESSAGE BROKER ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - apisix

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - apisix

  notification-inbox-worker:
    build:
      context: .
      dockerfile: src/Workers/NotificationInboxWorker/Dockerfile
    image: notification-inbox-worker:latest
    container_name: notification-inbox-worker
    restart: always
    healthcheck:
      # Worker'da tek ready kontrolü döngünün canlılığı: çöken process'i restart
      # toparlar, ama asılı kalan döngüyü ancak bu yakalar.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NotificationServiceDb;Username=ahmet;Password=Ahmet.123
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=587
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromName=Telgraf
      - Identity__BaseUrl=http://identity-service:8080
      - Internal__ApiKey=${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - apisix

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/Presentation/NotificationService.WebApi/Dockerfile
    image: notification-service:latest
    container_name: notification-service
    restart: always
    healthcheck:
      # /health/ready yalnızca Postgres'e bakar; Redis/Kafka/MinIO kesintisi tolere
      # edildiği için servisi rotasyondan düşürmez.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Açılışta EF migration'ları uygulanıyor; ilk saniyelerdeki başarısızlıklar sayılmamalı.
      start_period: 45s
    # Public REST endpoint'i yok (yalnızca Kafka consumer'ları çalışır) — dışarıya
    # port açmaya gerek yok, tüm trafik zaten APISIX üzerinden gelmiyor.
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NotificationServiceDb;Username=ahmet;Password=Ahmet.123
      - Kafka__BootstrapServers=kafka:9092
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=587
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromName=Telgraf
      - Notification__AdminEmail=${SMTP_USERNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - apisix

  # ─── SEARCH ─────────────────────────────────────────────────
  # Kafka'daki logları Elasticsearch'e taşır. Kendi aracımızı yazmak yerine bu
  # seçildi: toplu yazma, backpressure, retry ve reddedilen belge yönetimi hazır
  # geliyor — hepsi log hacminde (saniyede binlerce kayıt) elle çözülmesi zor işler.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    restart: always
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - apisix

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - apisix

  kibana:
    image: kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - apisix

  # ─── MONITORING ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.25.0
    restart: always
    ports:
      - "9090:9090/tcp"
    networks:
      - apisix

  # Yalnızca PANO için. Uyarılar buradan değil, sağlık kontrollerinden çıkıyor
  # (bkz. docker/grafana/provisioning/alerting/README.md).
  #
  # 7.3.7'den (2020) yükseltildi: o sürüm Elasticsearch'ü veri kaynağı olarak
  # düzgün desteklemiyordu, grafik çizilemiyordu.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Veri kaynakları ve uyarı kuralları dosyadan geliyor; arayüzden yapılan
      # değişiklikler container yeniden yaratılınca kaybolur, bunlar kalır.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

      # Grafana'nın kendi veritabanı (uyarı durumu, kullanıcı ayarları). Volume
      # olmadan her yeniden yaratmada uyarılar "yeni" sayılıp tekrar tetiklenirdi.
      - grafanadata:/var/lib/grafana
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - apisix

  # ─── SERVICES ───────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: src/Services/IdentityService/Presentation/IdentityService.WebApi/Dockerfile
    image: identity-service:latest
    container_name: identity-service
    restart: always
    healthcheck:
      # /health/ready yalnızca Postgres'e bakar; Redis/Kafka/MinIO kesintisi tolere
      # edildiği için servisi rotasyondan düşürmez.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Açılışta EF migration'ları uygulanıyor; ilk saniyelerdeki başarısızlıklar sayılmamalı.
      start_period: 45s
    # Dışarıya port açmıyor — tüm erişim APISIX gateway'i (:9080) üzerinden.
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NewsIdentityServiceDb;Username=ahmet;Password=Ahmet.123
      - Keycloak__Authority=http://keycloak:8080/realms/news-portal
      - Keycloak__PublicAuthority=http://localhost:8080/realms/news-portal
      - Keycloak__Audience=account
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__BaseUrl=http://keycloak:8080
      - Keycloak__Realm=news-portal
      - Keycloak__AdminClientId=admin-cli
      - Keycloak__AdminUsername=admin
      - Keycloak__AdminPassword=admin
      - Kafka__BootstrapServers=kafka:9092
      - Redis__Connection=redis:6379
      - Internal__ApiKey=${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apisix

  identity-outbox-worker:
    build:
      context: .
      dockerfile: src/Workers/IdentityOutboxWorker/Dockerfile
    image: identity-outbox-worker:latest
    container_name: identity-outbox-worker
    restart: always
    healthcheck:
      # Worker'da tek ready kontrolü döngünün canlılığı: çöken process'i restart
      # toparlar, ama asılı kalan döngüyü ancak bu yakalar.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NewsIdentityServiceDb;Username=ahmet;Password=Ahmet.123
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      - apisix

  news-outbox-worker:
    build:
      context: .
      dockerfile: src/Workers/NewsOutboxWorker/Dockerfile
    image: news-outbox-worker:latest
    container_name: news-outbox-worker
    restart: always
    healthcheck:
      # Worker'da tek ready kontrolü döngünün canlılığı: çöken process'i restart
      # toparlar, ama asılı kalan döngüyü ancak bu yakalar.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NewsServiceDb;Username=ahmet;Password=Ahmet.123
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      news-service:
        condition: service_healthy
    networks:
      - apisix

  # Üç servisin sağlığını tek sayfada toplayan panel. İzlediği servislerden
  # bağımsız bir container: birinin içinde koşsaydı o servis çöktüğünde panel de
  # erişilemez olurdu.
  healthcheck-api:
    build:
      context: .
      dockerfile: src/HealthCheck.Api/Dockerfile
    image: healthcheck-api:latest
    container_name: healthcheck-api
    restart: always
    ports:
      - "9095:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HealthChecksUI__EvaluationSeconds=15
      - HealthChecksUI__HealthChecks__0__Name=News Service
      - HealthChecksUI__HealthChecks__0__Uri=http://news-service:8080/health
      - HealthChecksUI__HealthChecks__1__Name=Identity Service
      - HealthChecksUI__HealthChecks__1__Uri=http://identity-service:8080/health
      - HealthChecksUI__HealthChecks__2__Name=Notification Service
      - HealthChecksUI__HealthChecks__2__Uri=http://notification-service:8080/health
      - HealthChecksUI__HealthChecks__3__Name=News Outbox Worker
      - HealthChecksUI__HealthChecks__3__Uri=http://news-outbox-worker:8080/health
      - HealthChecksUI__HealthChecks__4__Name=Identity Outbox Worker
      - HealthChecksUI__HealthChecks__4__Uri=http://identity-outbox-worker:8080/health
      - HealthChecksUI__HealthChecks__5__Name=Notification Inbox Worker
      - HealthChecksUI__HealthChecks__5__Uri=http://notification-inbox-worker:8080/health
      # Kendini de izliyor: içindeki "hata oranı" kontrolü sistem geneline ait bir
      # soru soruyor ve Unhealthy olduğunda diğer uyarılarla aynı webhook'tan çıkıyor.
      - HealthChecksUI__HealthChecks__6__Name=Log Hata Oranı
      - HealthChecksUI__HealthChecks__6__Uri=http://healthcheck-api:8080/health
      - Elasticsearch__Url=http://elasticsearch:9200
      - Alerting__ErrorRate__WindowMinutes=5
      - Alerting__ErrorRate__Threshold=10
      # Bir process Unhealthy'ye düştüğünde bildirim gider (dead-letter dahil).
      # HEALTH_WEBHOOK_URL .env'de tanımlanır; boşsa bildirim kurulmaz ve panel
      # yalnızca görsel uyarı verir. Slack/Discord webhook adresi gizli bilgidir,
      # repoya yazılmaz.
      - HealthChecksUI__Webhooks__0__Name=alerts
      - HealthChecksUI__Webhooks__0__Uri=${HEALTH_WEBHOOK_URL:-}
      - 'HealthChecksUI__Webhooks__0__Payload={"text":"[[LIVENESS]] SAĞLIKSIZ — [[FAILURE]]: [[DESCRIPTIONS]]"}'
      - 'HealthChecksUI__Webhooks__0__RestoredPayload={"text":"[[LIVENESS]] düzeldi."}'
    depends_on:
      # service_started bilinçli: panelin görevi servisleri izlemek, bu yüzden
      # onlar sağlıksızken de ayakta olmalı — sağlıklı olmalarını beklerse
      # tam ihtiyaç duyulduğu anda başlamaz.
      elasticsearch:
        condition: service_started
      news-service:
        condition: service_started
      identity-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - apisix

  news-service:
    build:
      context: .
      dockerfile: src/Services/NewsService/Presentation/NewsService.WebApi/Dockerfile
    image: news-service:latest
    container_name: news-service
    restart: always
    healthcheck:
      # /health/ready yalnızca Postgres'e bakar; Redis/Kafka/MinIO kesintisi tolere
      # edildiği için servisi rotasyondan düşürmez.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Açılışta EF migration'ları uygulanıyor; ilk saniyelerdeki başarısızlıklar sayılmamalı.
      start_period: 45s
    # Dışarıya port açmıyor — tüm erişim APISIX gateway'i (:9080) üzerinden.
    environment:
      - Logging__Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NewsServiceDb;Username=ahmet;Password=Ahmet.123
      - Keycloak__Authority=http://keycloak:8080/realms/news-portal
      - Keycloak__PublicAuthority=http://localhost:8080/realms/news-portal
      - Keycloak__Audience=account
      - Keycloak__RequireHttpsMetadata=false
      - Kafka__BootstrapServers=kafka:9092
      # Endpoint konteyner ağı içindir; PublicEndpoint tarayıcının eriştiği adres.
      # İmza host'u kapsadığı için imzalı URL'ler PublicEndpoint ile üretilmeli.
      - Redis__Connection=redis:6379
      - Storage__Endpoint=http://minio:9000
      - Storage__PublicEndpoint=http://localhost:9000
      - Storage__Bucket=${MINIO_BUCKET:-telgraf-media}
      - Storage__AccessKey=${MINIO_ROOT_USER:-telgraf}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD:-Telgraf.123}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - apisix

networks:
  apisix:
    driver: bridge

volumes:
  grafanadata:
  etcd_data:
  minio_data:
  postgres_data:
  redis_data:
  esdata:
  keycloak_data:

